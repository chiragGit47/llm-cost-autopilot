services:

  api:

    build:
      context: .

    image:
      llm-cost-autopilot

    container_name:
      llm-cost-autopilot-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - llm-cost-autopilot-data:/app/data

    restart:
      unless-stopped

    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]

      interval: 30s

      timeout: 5s

      retries: 3

      start_period: 10s


volumes:

  llm-cost-autopilot-data:

    external: true

    name:
      llm-cost-autopilot-data